app = "x402-tokens"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# Usage events outlive the log window. Each machine mounts its OWN 1GB volume
# and writes its own shard of usage_events.jsonl (Fly volumes are per-machine,
# not shared) — /v1/usage fans out over 6PN and merges the shards, and says how
# many machines answered so a partial read is never presented as complete.
[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  # Deliberately big, and deliberately ONE machine: the credit ledger in
  # src/credits.ts is machine-local (a file plus an in-memory Map), so with two
  # machines a prepaid balance was visible to roughly half of requests —
  # MEASURED as a balance alternating $2.99 / $0.00 across consecutive reads.
  # Until credit lives in a shared store, count must stay 1, which means the
  # single machine has to be able to carry the whole load.
  cpu_kind = "performance"
  cpus = 16
  memory_mb = 32768
